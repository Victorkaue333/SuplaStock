# =====================================================
# NGINX - CONFIGURAÇÃO DO SITE suplastock
# =====================================================
# Configuração que funciona com ou sem SSL

upstream django {
    server web:8000 fail_timeout=0;
    keepalive 32;
}

# ============================================
# SERVIDOR HTTP (desenvolvimento ou redirect)
# ============================================
server {
    listen 80;
    server_name _;
    
    # Para certificados Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Health check (sempre disponível)
    location /health/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        access_log off;
    }

    # Arquivos estáticos
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Arquivos de mídia
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Em produção, redirecionar para HTTPS
    # Descomente as linhas abaixo quando tiver SSL configurado
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Aplicação Django (quando não usar SSL)
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Rate limiting para login
    location /login/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(\.env|\.git|docker-compose|Dockerfile) {
        deny all;
    }
}

