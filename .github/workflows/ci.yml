# =====================================================
# CI/CD - GITHUB ACTIONS
# =====================================================
# Pipeline de IntegraÃ§Ã£o ContÃ­nua para SuplaStock

name: CI/CD Pipeline

on:
  push:
    branches: [main, desenvolvimento]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  DJANGO_SETTINGS_MODULE: 'suplastock.settings'

jobs:
  # ============================================
  # LINT E FORMATAÃ‡ÃƒO
  # ============================================
  lint:
    name: ðŸ” Lint & FormataÃ§Ã£o
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout cÃ³digo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Instalar dependÃªncias de lint
        run: |
          pip install --upgrade pip
          pip install flake8 black isort
      
      - name: Verificar formataÃ§Ã£o com Black
        run: black --check --diff suplastock/
      
      - name: Verificar imports com isort
        run: isort --check-only --diff suplastock/
      
      - name: Lint com Flake8
        run: flake8 suplastock/ --max-line-length=120 --ignore=E501,W503,E203

  # ============================================
  # TESTES
  # ============================================
  test:
    name: ðŸ§ª Testes
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_suplastock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout cÃ³digo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Instalar dependÃªncias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov coverage
      
      - name: Criar arquivo .env para testes
        run: |
          cat > suplastock/.env << EOF
          SECRET_KEY=test-secret-key-for-github-actions-only
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_ENGINE=sqlite
          EMAIL_BACKEND=console
          SECURE_SSL=False
          CACHE_BACKEND=dummy
          EOF
      
      - name: Executar migraÃ§Ãµes
        working-directory: suplastock
        run: python manage.py migrate --noinput
      
      - name: Executar testes
        working-directory: suplastock
        run: |
          python manage.py test gestao --verbosity=2
      
      - name: Executar testes com cobertura
        working-directory: suplastock
        run: |
          coverage run --source='gestao' manage.py test gestao
          coverage report -m
          coverage xml
      
      - name: Upload coverage para Codecov
        uses: codecov/codecov-action@v4
        with:
          file: suplastock/coverage.xml
          fail_ci_if_error: false

  # ============================================
  # SEGURANÃ‡A
  # ============================================
  security:
    name: ðŸ” VerificaÃ§Ã£o de SeguranÃ§a
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout cÃ³digo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Instalar dependÃªncias de seguranÃ§a
        run: |
          pip install --upgrade pip
          pip install safety bandit
      
      - name: Verificar vulnerabilidades com Safety
        run: safety check -r requirements.txt
      
      - name: AnÃ¡lise de seguranÃ§a com Bandit
        run: bandit -r suplastock/ -ll -ii -x suplastock/*/tests.py,suplastock/*/migrations/*

  # ============================================
  # BUILD DOCKER
  # ============================================
  build:
    name: ðŸ³ Build Docker
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout cÃ³digo
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: github.event_name != 'pull_request'
      
      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/va-suplementos:latest
            ${{ secrets.DOCKER_USERNAME }}/va-suplementos:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # DEPLOY STAGING
  # ============================================
  deploy-staging:
    name: ðŸš€ Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/desenvolvimento'
    environment: staging
    
    steps:
      - name: Deploy para Staging
        run: |
          echo "Deploy para ambiente de staging..."
          # Adicionar comandos de deploy aqui
          # Ex: ssh user@staging-server 'cd /app && ./scripts/deploy.sh staging'

  # ============================================
  # DEPLOY PRODUÃ‡ÃƒO
  # ============================================
  deploy-production:
    name: ðŸš€ Deploy ProduÃ§Ã£o
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Deploy para ProduÃ§Ã£o
        run: |
          echo "Deploy para ambiente de produÃ§Ã£o..."
          # Adicionar comandos de deploy aqui
          # Ex: ssh user@production-server 'cd /app && ./scripts/deploy.sh production'

